<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetWatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('web.dashboard') }}">NetWatch <span class="fw-normal">Network Monitor</span></a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="{{ url_for('web.saved_scans') }}">Saved scans</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('web.export_csv') }}">Export CSV</a></div></div></nav>
<main class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}
</body></html>
